name: Kinematics & Integration CI

on:
  push:
    branches: [ main, "feat/*" ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy pandas scikit-learn onnx onnxruntime matplotlib tqdm requests

      - name: Run Kinematics & Model Unit Tests
        run: |
          python tests/test_kinematics.py

      - name: Verify Data, Training & Deployment Imports
        run: |
          python -c "import data, models, training, distillation, deployment; print('All package imports succeeded')"
